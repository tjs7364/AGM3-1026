<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한끼배달 랜딩 페이지</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --coral: #F45A2A; --ink: #2B2321; --sub: #6B605C; --bg: #FFF7F3; --card: #FFFFFF; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--ink); padding: 48px 16px; word-break: keep-all; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-family: 'Do Hyeon', sans-serif; font-weight: 400; font-size: clamp(32px, 8vw, 48px); line-height: 1.2; }
  h1 span { color: var(--coral); }
  p.lead { color: var(--sub); margin: 10px 0 28px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  a.card { display: block; background: var(--card); border-radius: 18px; padding: 22px; text-decoration: none; color: inherit; box-shadow: 0 8px 24px rgba(43,35,33,.08); border: 2px solid transparent; }
  a.card:hover, a.card:focus-visible { border-color: var(--coral); outline: none; }
  .tag { font-size: 12px; font-weight: 700; color: var(--coral); }
  a.card h2 { font-size: 20px; margin: 4px 0 6px; }
  a.card p { font-size: 14px; color: var(--sub); }
  footer { margin-top: 32px; font-size: 12px; color: var(--sub); }
</style>
</head>
<body data-page="index">
<main>
  <h1><span>한끼배달</span> 랜딩 페이지</h1>
  <p class="lead">광고 클릭 후 도착하는 마케팅 랜딩 페이지 2종입니다.</p>
  <div class="grid">
    <a class="card" href="hankki_customer.html" data-cta="index_customer" data-cta-kind="nav">
      <span class="tag">고객용</span>
      <h2>웰컴 혜택</h2>
      <p>처음이거나 1년 만에 돌아온 고객에게 첫 주문 할인, 한끼패스 무료 체험, 친구 초대 쿠폰을 안내해요.</p>
    </a>
    <a class="card" href="hankki_owner.html" data-cta="index_owner" data-cta-kind="nav">
      <span class="tag">사장님용</span>
      <h2>입점 혜택</h2>
      <p>신규 사장님께 상위노출, 배달비·광고비 지원, 수수료 할인과 성장 지원 프로그램을 안내해요.</p>
    </a>
  </div>
  <footer>한끼배달은 마케팅 실습용 가상 브랜드이며 실제 서비스가 아닙니다.</footer>
</main>
<!-- Amplitude Analytics: API 키는 build_site.py가 .env 값으로 치환 (비밀키는 페이지에 넣지 않음) -->
<script src="https://cdn.jsdelivr.net/npm/@amplitude/analytics-browser@2.48.1/lib/scripts/amplitude-min.js"></script>
<script>
  (function () {
    var KEY = '21ff3cfa5bc20c21ea8ea53ceeecd4e4';
    if (!window.amplitude || KEY.indexOf('%%') === 0) return;
    window.amplitude.init(KEY, {
      autocapture: { pageViews: true, sessions: true, attribution: true, formInteractions: false, fileDownloads: false, elementInteractions: false }
    });
  })();
</script>
<!-- CTA 노출·클릭 수집: [data-cta] 요소마다 cta_impression(화면 50% 이상 노출, 페이지뷰당 1회) / cta_click 기록 -->
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var PAGE = document.body.getAttribute('data-page') || 'index';
  var IS_TEST = params.get('test') === '1'; // 테스트 모드: 이벤트에 is_test 표시 + 실제 이동 생략
  var base = {
    page: PAGE,
    audience: PAGE === 'index' ? 'index' : PAGE,
    utm_source: params.get('utm_source') || 'direct',
    utm_campaign: params.get('utm_campaign') || undefined,
    viewport: innerWidth < 768 ? 'mobile' : innerWidth < 1024 ? 'tablet' : 'desktop'
  };
  if (IS_TEST) base.is_test = true;

  function info(el) {
    var href = el.getAttribute('href') || '';
    var kind = el.getAttribute('data-cta-kind') ||
      (el.classList.contains('js-store') ? 'store' : el.classList.contains('js-download') ? 'download' :
       href.indexOf('tel:') === 0 ? 'tel' : el.tagName === 'BUTTON' ? 'button' : 'link');
    return Object.assign({
      cta_id: el.getAttribute('data-cta'),
      cta_kind: kind,
      cta_label: (el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 60),
      cta_store: el.getAttribute('data-store') || undefined
    }, base);
  }
  function send(name, props) {
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push(Object.assign({ event: name }, props));
    if (window.amplitude && window.amplitude.track) return window.amplitude.track(name, props);
  }
  window.__ctaSend = send;

  /* 노출: 50% 이상 보이면 1회 (sticky·모달처럼 나중에 보이는 CTA도 그 시점에 기록) */
  var seen = new WeakSet();
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      var el = en.target;
      if (!en.isIntersecting || seen.has(el)) return;
      var r = el.getBoundingClientRect();
      if (r.width === 0 || r.height === 0) return; // display:none 등 실제로 안 보이는 경우 제외
      seen.add(el);
      io.unobserve(el);
      send('cta_impression', info(el));
    });
  }, { threshold: 0.5 });
  document.querySelectorAll('[data-cta]').forEach(function (el) { io.observe(el); });

  /* 클릭: 캡처 단계에서 먼저 기록 → 페이지를 떠나는 CTA는 전송 후 이동 */
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-cta]');
    if (!el) return;
    var props = info(el);
    if (IS_TEST) {
      e.preventDefault(); e.stopImmediatePropagation();
      send('cta_click', props);
      console.info('[CTA 테스트] click', props.cta_id);
      return;
    }
    var res = send('cta_click', props);
    var href = el.getAttribute('href') || '';
    var leaves = href && href.charAt(0) !== '#' && href.indexOf('tel:') !== 0 && !el.classList.contains('js-download') && !el.classList.contains('js-store');
    if (leaves && res && res.promise && !(e.ctrlKey || e.metaKey || e.shiftKey)) {
      e.preventDefault();
      var go = function () { location.href = href; };
      Promise.race([res.promise, new Promise(function (r) { setTimeout(r, 600); })]).then(go, go);
    }
  }, true);

  /* 스토어 이동 CTA(js-download/js-store)는 페이지 스크립트가 호출: 전송 완료(최대 0.6초) 후 이동 */
  window.__ctaFlushThen = function (fn) {
    var done = false, go = function () { if (!done) { done = true; fn(); } };
    try { window.amplitude.flush().promise.then(go, go); } catch (err) { go(); }
    setTimeout(go, 600);
  };
})();
</script>
</body>
</html>
